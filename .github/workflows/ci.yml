name: Java domain checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Domain and CSV persistence checks
        run: bash scripts/test-domain.sh
      - name: Compile JavaFX application
        run: mvn -B -q -DskipTests package
